<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D打印精细珠宝名牌生成器 (含尺寸与时间预估)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #e4e4e7; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 380px; background: #18181b; border-right: 1px solid #27272a; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #09090b; }
        h2 { font-size: 1.1rem; color: #f4f4f5; border-bottom: 1px solid #27272a; padding-bottom: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #a1a1aa; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], select, input[type="range"] { background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; width: 100%; }
        input[type="text"]:focus, select:focus { outline: none; border-color: #a855f7; }
        /* Checkbox styling */
        .checkbox-group { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #9333ea; cursor: pointer; }
        .checkbox-group label { font-size: 0.85rem; color: #e4e4e7; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .checkbox-group .tip { font-size: 0.72rem; color: #a1a1aa; display: block; margin-top: 2px; }
        .btn { background: #9333ea; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn:hover { background: #7e22ce; }
        .btn-secondary { background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; }
        .preview-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; min-height: 0; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .card-header { padding: 12px 16px; background: #202024; border-bottom: 1px solid #27272a; font-size: 0.88rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .card-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; background-image: radial-gradient(#27272a 1px, transparent 1px); background-size: 16px 16px; }
        /* 3D Scene container with CSS 3D perspective */
        .scene-3d { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; perspective: 1200px; overflow: hidden; }
        .card-3d-wrapper { width: 420px; height: 280px; position: relative; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        .card-3d-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        /* Canvas for 3D rendering */
        #renderCanvas { width: 100%; height: 100%; border-radius: 8px; cursor: grab; }
        #renderCanvas:active { cursor: grabbing; }
        /* SVG preview */
        svg { max-width: 100%; max-height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        /* Stats panel */
        .stats-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #202024; padding: 10px; border-radius: 6px; border: 1px solid #27272a; margin-top: 4px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .stat-label { font-size: 0.7rem; color: #a1a1aa; }
        .stat-value { font-size: 0.95rem; font-weight: 700; color: #c084fc; margin-top: 2px; }
        /* Hint text for 3D interaction */
        .interaction-hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #71717a; pointer-events: none; }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600&family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Italianno&family=Montserrat:wght@300&family=Parisienne&family=Pinyon+Script&family=Sacramento&family=Tangerine:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <h2>✨ 3D打印珠宝名牌生成器</h2>
        <!-- Stats panel -->
        <div class="stats-panel">
            <div class="stat-box">
                <span class="stat-label">成品尺寸 (W×H)</span>
                <span class="stat-value" id="statSize">58×22 mm</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">预估打印耗时</span>
                <span class="stat-value" id="statTime">14 分钟</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">预估耗材用量</span>
                <span class="stat-value" id="statWeight">3.2 克</span>
            </div>
        </div>
        <div class="form-group">
            <label>定制英文名 (Name)</label>
            <input type="text" id="nameInput" value="Lesley" placeholder="输入英文名...">
        </div>
        <div class="form-group">
            <label>手写艺术字体 (10种可选)</label>
            <select id="fontSelect">
                <option value="'Great Vibes', cursive">1. Great Vibes (经典华丽连笔)</option>
                <option value="'Pinyon Script', cursive">2. Pinyon Script (宫廷复古体)</option>
                <option value="'Alex Brush', cursive">3. Alex Brush (清爽流畅体)</option>
                <option value="'Parisienne', cursive">4. Parisienne (法式浪漫体)</option>
                <option value="'Tangerine', cursive">5. Tangerine (纤细高雅体)</option>
                <option value="'Sacramento', cursive">6. Sacramento (现代手写体)</option>
                <option value="'Italianno', cursive">7. Italianno (意式古典体)</option>
                <option value="'Caveat', cursive">8. Caveat (灵动随性体)</option>
                <option value="'Cinzel Decorative', serif">9. Cinzel Decorative (衬线徽章体)</option>
                <option value="'Montserrat', sans-serif">10. Montserrat (极简现代几何)</option>
            </select>
        </div>
        <div class="form-group">
            <label>点缀花纹 (10种图案)</label>
            <select id="motifSelect">
                <option value="butterfly">🦋 灵动蝴蝶 (Butterfly)</option>
                <option value="rose">🌹 浪漫玫瑰 (Rose)</option>
                <option value="moon">🌙 新月繁星 (Moon & Stars)</option>
                <option value="wings">🕊️ 天使之翼 (Angel Wings)</option>
                <option value="heart">❤️ 镂空爱心 (Heart)</option>
                <option value="star">⭐ 闪耀星芒 (Sparkle Star)</option>
                <option value="filigree">🌿 巴洛克卷草 (Baroque)</option>
                <option value="swallow">🕊️ 极简飞鸟 (Swallow)</option>
                <option value="harp">🎻 优雅竖琴 (Harp)</option>
                <option value="crown">👑 皇冠徽章 (Crown)</option>
                <option value="none">❌ 无花纹 (No Motif)</option>
            </select>
        </div>
        <div class="form-group">
            <label>花纹摆放位置</label>
            <select id="placementSelect">
                <option value="both">两侧对称 (Both Sides)</option>
                <option value="left">仅左侧 (Left Only)</option>
                <option value="right">仅右侧 (Right Only)</option>
            </select>
        </div>
        <div class="form-group">
            <label>3D打印耗材材质</label>
            <select id="materialSelect">
                <option value="silk-red">🔴 丝绸红 PLA (Silk Red)</option>
                <option value="silk-green">🟢 丝绸绿 PLA (Silk Green)</option>
                <option value="pastel-pink">🌸 马卡龙粉 PLA (Pastel Pink)</option>
                <option value="pastel-blue">🐬 马卡龙蓝 PLA (Pastel Blue)</option>
                <option value="matte-white">⚪ 高光/哑光白 PLA (Matte White)</option>
                <option value="gold">🥇 18K 黄金质感 (18K Gold)</option>
                <option value="silver">🥈 S925 纯银质感 (925 Silver)</option>
                <option value="rose-gold">👑 玫瑰金 (Rose Gold)</option>
                <option value="wood">🪵 木质 PLA (Wood Filament)</option>
            </select>
        </div>
        <div class="form-group">
            <label>吊坠厚度 (Z轴拉伸高度) <span id="thickValue">2.0 mm</span></label>
            <input type="range" id="thickSlider" min="1.0" max="4.0" step="0.2" value="2.0">
        </div>
        <div class="form-group">
            <label>字体字号大小 <span id="sizeValue">60 px</span></label>
            <input type="range" id="sizeSlider" min="40" max="90" value="60">
        </div>
        <!-- NEW: Solid base rail bridge checkbox -->
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="baseBridgeCheck">
                <label for="baseBridgeCheck">
                    <span>增加实心底座导轨桥</span>
                    <span class="tip">用于防止实体3D件断裂，增强结构稳定性</span>
                </label>
            </div>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" id="downloadBtn">⬇️ 导出 3D 打印用 SVG 文件</button>
            <button class="btn btn-secondary" onclick="alert('提示：已准备好 G-code 数据，可直接将 SVG 拖入拓竹(Bambu Lab)切片软件')">🖨️ 发送到 3D 打印机</button>
        </div>
    </div>
    <div class="main-content">
        <div class="preview-container">
            <!-- 2D SVG Preview -->
            <div class="card">
                <div class="card-header">
                    <span>2D 矢量 SVG 路径 (实时连笔/包含穿孔)</span>
                    <span style="font-size:0.75rem; color:#a1a1aa;">用于切片拉伸</span>
                </div>
                <div class="card-body">
                    <svg id="svgPreview" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
                    </svg>
                </div>
            </div>
            <!-- 3D Preview -->
            <div class="card">
                <div class="card-header">
                    <span>3D 打印成品演示 (鼠标交互)</span>
                    <span id="materialBadge" style="font-size:0.75rem; color:#c084fc;">丝绸红 PLA</span>
                </div>
                <div class="card-body">
                    <div class="scene-3d" id="scene3d">
                        <div class="card-3d-wrapper" id="card3d">
                            <canvas id="renderCanvas"></canvas>
                        </div>
                    </div>
                    <div class="interaction-hint">🖱️ 鼠标移动旋转 | 滚轮缩放 | 拖拽平移</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // === DOM Elements ===
        const nameInput = document.getElementById('nameInput');
        const fontSelect = document.getElementById('fontSelect');
        const motifSelect = document.getElementById('motifSelect');
        const placementSelect = document.getElementById('placementSelect');
        const materialSelect = document.getElementById('materialSelect');
        const sizeSlider = document.getElementById('sizeSlider');
        const thickSlider = document.getElementById('thickSlider');
        const sizeValue = document.getElementById('sizeValue');
        const thickValue = document.getElementById('thickValue');
        const svgPreview = document.getElementById('svgPreview');
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const materialBadge = document.getElementById('materialBadge');
        const statSize = document.getElementById('statSize');
        const statTime = document.getElementById('statTime');
        const statWeight = document.getElementById('statWeight');
        const baseBridgeCheck = document.getElementById('baseBridgeCheck');
        const scene3d = document.getElementById('scene3d');
        const card3d = document.getElementById('card3d');

        // === Material Colors ===
        const materialColors = {
            'silk-red': { base: '#dc2626', highlight: '#fca5a5', shadow: '#7f1d1d', name: '丝绸红 PLA', gradient: ['#dc2626','#f87171','#dc2626'] },
            'silk-green': { base: '#16a34a', highlight: '#86efac', shadow: '#14532d', name: '丝绸绿 PLA', gradient: ['#16a34a','#4ade80','#16a34a'] },
            'pastel-pink': { base: '#f472b6', highlight: '#fbcfe8', shadow: '#9d174d', name: '马卡龙粉 PLA', gradient: ['#f472b6','#f9a8d4','#f472b6'] },
            'pastel-blue': { base: '#38bdf8', highlight: '#bae6fd', shadow: '#0369a1', name: '马卡龙蓝 PLA', gradient: ['#38bdf8','#7dd3fc','#38bdf8'] },
            'matte-white': { base: '#e4e4e7', highlight: '#ffffff', shadow: '#71717a', name: '高光/哑光白 PLA', gradient: ['#e4e4e7','#f4f4f5','#a1a1aa'] },
            'gold': { base: '#eab308', highlight: '#fef08a', shadow: '#854d0e', name: '18K 黄金', gradient: ['#eab308','#fde047','#eab308'] },
            'silver': { base: '#94a3b8', highlight: '#f1f5f9', shadow: '#475569', name: 'S925 纯银', gradient: ['#94a3b8','#cbd5e1','#94a3b8'] },
            'rose-gold': { base: '#fb7185', highlight: '#ffe4e6', shadow: '#9f1239', name: '玫瑰金', gradient: ['#fb7185','#fda4af','#fb7185'] },
            'wood': { base: '#b45309', highlight: '#fde68a', shadow: '#78350f', name: '木质 PLA', gradient: ['#b45309','#d97706','#b45309'] }
        };

        // === Motif SVG paths (for Canvas drawing) ===
        const motifsSVG = {
            butterfly: `M-22,-8 C-18,-20 -5,-16 -2,-4 C-8,0 -16,0 -22,-8 Z M-22,8 C-18,20 -5,16 -2,4 C-8,0 -16,0 -22,8 Z M-2,-4 C2,-12 12,-12 8,0 C4,0 0,-2 -2,-4 Z M-2,4 C2,12 12,12 8,0 C4,0 0,2 -2,4 Z`,
            rose: `M0,0 C-3,-8 -10,-4 -6,2 C-12,0 -8,-8 -2,-6 C0,-12 4,-12 6,-6 C12,-8 12,0 6,2 C8,8 4,12 0,10 C-4,12 -8,8 -6,2 C-12,0 -8,-8 -2,-6 C0,-12 0,0 0,0 Z`,
            moon: `M0,-9 C9,-9 11,-1 7,4 C3,9 -2,9 -4,7 C-9,3 -9,-3 -6,-7 C-2,-11 0,-9 0,-9 Z M8,-5 L9.2,-2.2 L12,-2.2 L9.8,0 L10.8,2.8 L8,1.5 L5.2,2.8 L6.2,0 L4,-2.2 L6.8,-2.2 Z M-7,-6 L-6.2,-4.2 L-4.2,-4.2 L-5.8,-3 L-5,-1.2 L-7,-2 L-8.8,-3 L-7.4,-4.2 L-5.8,-4.2 Z`,
            wings: `M-25,4 C-15,-12 -4,-12 0,0 C-6,-4 -14,-4 -18,4 M-20,6 C-14,-4 -6,-4 -2,2`,
            heart: `M0,8 C-12,-2 -15,-10 -7,-14 C-2,-16 0,-10 0,-10 C0,-10 2,-16 7,-14 C15,-10 12,-2 0,8 Z`,
            star: `M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z`,
            filigree: `M-20,0 Q-10,-12 0,0 T20,0 M-10,-4 Q-3,-12 3,-4`,
            swallow: `M-15,0 C-8,-8 0,-8 10,-2 C2,-2 -2,4 -15,0 Z M-5,-4 C0,-12 12,-10 8,-2`,
            harp: `M-8,-12 L-8,10 C2,10 8,4 8,-6 Z M-5,-8 L5,-5 M-5,-4 L5,-2 M-5,0 L5,1`,
            crown: `M-12,8 L-15,-6 L-6,0 L0,-10 L6,0 L15,-6 L12,8 Z`
        };

        
        // === Letter Connection Helpers ===
        function measureTextChars(text, fontStr) {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            ctx.font = fontStr;
            const widths = [];
            for (let i = 0; i < text.length; i++) {
                widths.push(ctx.measureText(text[i]).width);
            }
            return widths;
        }

        function getLetterBridgePaths(name, fontStr, size, letterSpacing, color) {
            const widths = measureTextChars(name, 'bold ' + size + 'px ' + fontStr);
            const textWidth = widths.reduce((a,b) => a+b, 0) + (name.length - 1) * letterSpacing;
            const startX = 250 - textWidth / 2;
            const yBottom = 105 + size * 0.35;
            
            let paths = '';
            let x = startX;
            for (let i = 0; i < name.length - 1; i++) {
                const x1 = x + widths[i];
                x += widths[i] + letterSpacing;
                const x2 = x;
                // Small arc bridge connecting adjacent letters at bottom
                paths += '<path d="M' + x1 + ',' + yBottom + ' C' + x1 + ',' + (yBottom-5) + ' ' + x2 + ',' + (yBottom-5) + ' ' + x2 + ',' + yBottom + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>';
            }
            return paths;
        }

        function getSideConnectionPaths(name, fontStr, size, letterSpacing, color, placement, motif, leftLoopX, rightLoopX) {
            const widths = measureTextChars(name, 'bold ' + size + 'px ' + fontStr);
            const textWidth = widths.reduce((a,b) => a+b, 0) + (name.length - 1) * letterSpacing;
            const yCenter = 100;
            
            let paths = '';
            
            // Left side connection
            if (motif === 'none') {
                // No motif: connect left loop to first letter
                const firstLetterX = 250 - textWidth/2 + widths[0];
                paths += '<line x1="' + (leftLoopX + 7) + '" y1="' + yCenter + '" x2="' + firstLetterX + '" y2="' + yCenter + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>';
            } else if (placement === 'both' || placement === 'left') {
                // Motif present on left: connect left motif to first letter
                const motifX = 250 - textWidth/2 - 30;
                const firstLetterX = 250 - textWidth/2 + widths[0];
                paths += '<line x1="' + (motifX + 14) + '" y1="' + yCenter + '" x2="' + firstLetterX + '" y2="' + yCenter + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>';
            }
            
            // Right side connection
            if (motif === 'none') {
                // No motif: connect right loop to last letter
                const lastLetterX = 250 + textWidth/2 - widths[widths.length-1];
                paths += '<line x1="' + lastLetterX + '" y1="' + yCenter + '" x2="' + (rightLoopX - 7) + '" y2="' + yCenter + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>';
            } else if (placement === 'both' || placement === 'right') {
                // Motif present on right: connect right motif to last letter
                const motifX = 250 + textWidth/2 + 30;
                const lastLetterX = 250 + textWidth/2 - widths[widths.length-1];
                paths += '<line x1="' + lastLetterX + '" y1="' + yCenter + '" x2="' + (motifX - 14) + '" y2="' + yCenter + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>';
            }
            
            return paths;
        }

// === 3D Interaction State ===
        let rotX = -15; // Initial tilt angle
        let rotY = 0;
        let zoom = 1.0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let autoRotate = true;
        let autoRotateSpeed = 0.3;

        // === Draw Motif on Canvas ===
        function drawMotif(ctx, motifType, x, y, scale, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            
            const pathStr = motifsSVG[motifType];
            if (!pathStr) { ctx.restore(); return; }
            
            try {
                // Parse SVG path and draw
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(
                    `<svg xmlns="http://www.w3.org/2000/svg"><path d="${pathStr}"/></svg>`, 
                    'image/svg+xml'
                );
                const pathEl = svgDoc.querySelector('path');
                let path = null;
                if (pathEl) {
                    path = new Path2D(pathEl.getAttribute('d'));
                    ctx.fill(path);
                }
                // Also draw stroke paths
                if (path && (motifType === 'wings' || motifType === 'filigree' || motifType === 'harp' || motifType === 'swallow' || motifType === 'rose' || motifType === 'moon')) {
                    ctx.lineWidth = 2.5;
                    ctx.stroke(path);
                }
            } catch(e) {
                // Fallback: draw simple shapes
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // === Main Render Function ===
        function renderAll() {
            const name = nameInput.value || "Lesley";
            const font = fontSelect.value;
            const motif = motifSelect.value;
            const placement = placementSelect.value;
            const size = parseInt(sizeSlider.value);
            const thickness = parseFloat(thickSlider.value);
            const mat = materialColors[materialSelect.value];
            const hasBaseBridge = baseBridgeCheck.checked;
            
            sizeValue.innerText = size + " px";
            thickValue.innerText = parseFloat(thickness).toFixed(1) + " mm";
            materialBadge.innerText = mat.name;
            
            // Letter spacing: slightly increased but keeping connected
            const letterSpacing = Math.max(1.5, size * 0.06);
            
            // Calculate text dimensions
            const textWidth = name.length * (size * 0.48 + letterSpacing);
            const totalWidth = textWidth + (placement === 'both' ? 140 : 80);
            
            // Update SVG preview
            const leftLoopX = 250 - textWidth/2 - (placement === 'both' || placement === 'left' ? 55 : 20);
            const rightLoopX = 250 + textWidth/2 + (placement === 'both' || placement === 'right' ? 55 : 20);
            
            let leftMotif = '';
            let rightMotif = '';
            if (placement === 'both' || placement === 'left') {
                leftMotif = `<g transform="translate(${250 - textWidth/2 - 30}, 100) scale(1.3)">${getMotifSVG(motif, mat.base)}</g>`;
            }
            if (placement === 'both' || placement === 'right') {
                rightMotif = `<g transform="translate(${250 + textWidth/2 + 30}, 100) scale(-1.3, 1.3)">${getMotifSVG(motif, mat.base)}</g>`;
            }
            
            const baseBridgeRect = hasBaseBridge ? `
                <rect x="${250 - textWidth/2 - 15}" y="${118}" width="${textWidth + 30}" height="5" rx="2" fill="${mat.base}" stroke="${mat.shadow}" stroke-width="1"/>
                <rect x="${250 - textWidth/2 - 10}" y="${123}" width="${textWidth + 20}" height="3" rx="1" fill="${mat.shadow}"/>
            ` : '';
            
            // Calculate letter positions for connections
            const letterWidths = measureTextChars(name, 'bold ' + size + 'px ' + font);
            const letterBridges = getLetterBridgePaths(name, font, size, letterSpacing, mat.base);
            const sideConnections = getSideConnectionPaths(name, font, size, letterSpacing, mat.base, placement, motif, leftLoopX, rightLoopX);
            
            const svgContent = `
                <circle cx="${leftLoopX}" cy="100" r="7" fill="none" stroke="${mat.base}" stroke-width="3"/>
                <circle cx="${leftLoopX}" cy="100" r="3.5" fill="none" stroke="${mat.shadow}" stroke-width="1.5"/>
                <circle cx="${rightLoopX}" cy="100" r="7" fill="none" stroke="${mat.base}" stroke-width="3"/>
                <circle cx="${rightLoopX}" cy="100" r="3.5" fill="none" stroke="${mat.shadow}" stroke-width="1.5"/>
                <g color="${mat.base}">${leftMotif}</g>
                <g color="${mat.base}">${rightMotif}</g>
                ${sideConnections}
                ${letterBridges}
                ${baseBridgeRect}
                <text x="250" y="105" font-family="${font}" font-size="${size}px" fill="${mat.base}" text-anchor="middle" dominant-baseline="middle" letter-spacing="${letterSpacing}" style="font-weight: bold;">${name}</text>
            `;
            svgPreview.innerHTML = svgContent;
            
            // Update calculations
            updateCalculations(name.length, size, thickness, totalWidth, hasBaseBridge);
            
            // Render 3D canvas
            render3DCanvas(name, font, mat, size, thickness, leftLoopX, rightLoopX, placement, motif, hasBaseBridge, letterSpacing, letterWidths);
        }

        function getMotifSVG(motifType, color) {
            const pathStr = motifsSVG[motifType];
            if (!pathStr) return '';
            // Return SVG string for use in SVG context (fill + stroke for consistency with 3D canvas)
            const strokeMotifs = ['wings','filigree','harp','swallow','rose','moon'];
            const needStroke = strokeMotifs.includes(motifType);
            if (needStroke) {
                return `<path d="${pathStr}" fill="${color}" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
            }
            return `<path d="${pathStr}" fill="${color}"/>`;
        }

        function updateCalculations(charCount, fontSize, thickness, totalSvgWidth, hasBaseBridge) {
            const realWidthMM = Math.round(totalSvgWidth * 0.28);
            const realHeightMM = Math.round(fontSize * 0.45);
            statSize.innerText = `${realWidthMM} × ${realHeightMM} mm`;
            
            const extraVolume = hasBaseBridge ? 0.3 : 0;
            const volumeCM3 = (realWidthMM * realHeightMM * thickness * 0.45) / 1000 + extraVolume;
            const weightG = (volumeCM3 * 1.25).toFixed(1);
            statWeight.innerText = `${weightG} 克`;
            
            const layerCount = Math.ceil(thickness / 0.16);
            const estimatedMinutes = Math.round(8 + (layerCount * 0.6) + (charCount * 0.8) + (hasBaseBridge ? 3 : 0));
            statTime.innerText = `${estimatedMinutes} 分钟`;
        }

        // === 3D Canvas Render ===
        function render3DCanvas(name, font, mat, size, thickness, leftLoopX, rightLoopX, placement, motif, hasBaseBridge, letterSpacing, letterWidths) {
            // Resize canvas
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            
            const w = rect.width;
            const h = rect.height;
            const cX = w / 2;
            const cY = h / 2;
            
            // === SVG viewBox (0 0 500 200) → Canvas 坐标映射 ===
            // 计算缩放比以保持宽高比，内容居中显示
            const svgViewW = 500;
            const svgViewH = 200;
            const scaleX = w / svgViewW;
            const scaleY = h / svgViewH;
            const svgScale = Math.min(scaleX, scaleY);
            const contentW = svgViewW * svgScale;
            const contentH = svgViewH * svgScale;
            const svgOffX = (w - contentW) / 2;
            const svgOffY = (h - contentH) / 2;
            
            // SVG坐标 → Canvas坐标 转换函数
            function svgToCanvasX(svgX) { return svgX * svgScale + svgOffX; }
            function svgToCanvasY(svgY) { return svgY * svgScale + svgOffY; }
            
            ctx.clearRect(0, 0, w, h);
            
            // Apply 3D transform simulation via canvas transform
            ctx.save();
            
            // Zoom
            ctx.translate(cX, cY);
            ctx.scale(zoom, zoom);
            ctx.translate(-cX, -cY);
            
            // Pan
            ctx.translate(panX, panY);
            
            // Simulated 3D rotation (rotate around Y axis then X axis)
            const radY = rotY * Math.PI / 180;
            const radX = rotX * Math.PI / 180;
            
            // Apply rotation simulation
            ctx.translate(cX, cY);
            ctx.transform(
                Math.cos(radY), Math.sin(radX) * Math.sin(radY),
                0, 1,
                0, 0
            );
            ctx.translate(-cX, -cY);
            
            // Calculate text bounds for 3D positioning
            const textW = name.length * (size * 0.48 + letterSpacing);
            const textH = size * 0.8;
            const tx = cX - textW / 2;
            const ty = cY - textH / 2;
            
            const extrudeLayers = Math.round(thickness * 3);
            
            // Draw base rail bridge (3D extruded base) - 使用SVG→Canvas映射
            if (hasBaseBridge) {
                ctx.save();
                // SVG中底座位置: y=118 (即100+18)，转换为canvas坐标
                const bridgeBaseY = svgToCanvasY(118);
                ctx.translate(cX, bridgeBaseY + 8 * svgScale);
                // Base platform - extruded
                for (let i = extrudeLayers; i > 0; i--) {
                    ctx.fillStyle = i === 1 ? mat.highlight : (i === extrudeLayers ? mat.shadow : mat.base);
                    ctx.fillRect(-textW * svgScale / 2 - 12 * svgScale, -3 * svgScale + i * 0.5 * svgScale, (textW + 24) * svgScale, 5 * svgScale);
                }
                // Bridge connectors (left and right)
                for (let i = extrudeLayers; i > 0; i--) {
                    ctx.fillStyle = i === 1 ? mat.highlight : (i === extrudeLayers ? mat.shadow : mat.base);
                    // Left connector
                    ctx.fillRect(-textW * svgScale / 2 - 18 * svgScale, -2 * svgScale + i * 0.5 * svgScale, 8 * svgScale, 4 * svgScale);
                    // Right connector
                    ctx.fillRect(textW * svgScale / 2 + 10 * svgScale, -2 * svgScale + i * 0.5 * svgScale, 8 * svgScale, 4 * svgScale);
                }
                ctx.restore();
            }
            
            // Draw 3D extrusion effect (shadow layers)
            for (let i = extrudeLayers; i > 0; i--) {
                ctx.save();
                const offset = i * 0.8;
                ctx.translate(offset * Math.cos(radY) * 0.5, offset * Math.sin(radX) * 0.5 + offset * 0.3);
                
                // Layer color
                if (i === 1) {
                    ctx.fillStyle = mat.highlight;
                } else if (i === extrudeLayers) {
                    ctx.fillStyle = mat.shadow;
                } else {
                    ctx.fillStyle = mat.base;
                }
                
                // Draw text with extrusion (使用SVG→Canvas坐标映射)
                const textCX = svgToCanvasX(250);
                const textCY = svgToCanvasY(100) + 5 * svgScale;
                ctx.font = `bold ${size * svgScale}px ${font}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, textCX, textCY, textW * svgScale + 20);
                
                // Draw loops (left and right) with extrusion (使用映射坐标)
                const loopLX = svgToCanvasX(leftLoopX);
                const loopLY = svgToCanvasY(100);
                const loopRX = svgToCanvasX(rightLoopX);
                ctx.lineWidth = 3 * svgScale;
                ctx.strokeStyle = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(loopLX, loopLY, 7 * svgScale, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(loopRX, loopLY, 7 * svgScale, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
            
            // Draw top face (main color)
            ctx.save();
            ctx.translate(cX, cY);
            ctx.fillStyle = mat.base;
            // 使用SVG→Canvas映射坐标 (转换为相对于cX,cY的坐标)
            const topTextCX = svgToCanvasX(250) - cX;
            const topTextCY = svgToCanvasY(100) + 5 * svgScale - cY;
            ctx.font = `bold ${size * svgScale}px ${font}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, topTextCX, topTextCY, textW * svgScale + 20);
            
            // Draw loops on top face (使用映射坐标)
            const topLoopLX = svgToCanvasX(leftLoopX) - cX;
            const topLoopLY = svgToCanvasY(100) - cY;
            const topLoopRX = svgToCanvasX(rightLoopX) - cX;
            ctx.lineWidth = 3 * svgScale;
            ctx.strokeStyle = mat.highlight;
            ctx.beginPath();
            ctx.arc(topLoopLX, topLoopLY, 7 * svgScale, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(topLoopRX, topLoopLY, 7 * svgScale, 0, Math.PI * 2);
            ctx.stroke();
            
            // Draw inner loop details
            ctx.lineWidth = 1.5 * svgScale;
            ctx.strokeStyle = mat.shadow;
            ctx.beginPath();
            ctx.arc(topLoopLX, topLoopLY, 3.5 * svgScale, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(topLoopRX, topLoopLY, 3.5 * svgScale, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();
            
            // === Draw letter-to-letter connection bridges on 3D canvas ===
            if (letterWidths && letterWidths.length > 1) {
                const textW_calc = letterWidths.reduce((a,b) => a+b, 0) + (name.length - 1) * letterSpacing;
                const startX_calc = 250 - textW_calc / 2;
                const yBottom_calc = 105 + size * 0.35;
                
                ctx.save();
                ctx.strokeStyle = mat.base;
                ctx.lineWidth = 2.5 * svgScale;
                ctx.lineCap = 'round';
                
                let x_calc = startX_calc;
                for (let i = 0; i < name.length - 1; i++) {
                    const x1_calc = x_calc + letterWidths[i];
                    x_calc += letterWidths[i] + letterSpacing;
                    const x2_calc = x_calc;
                    const cy_top = svgToCanvasY(yBottom_calc - 5);
                    const cy_bot = svgToCanvasY(yBottom_calc);
                    // Draw cubic bezier curve (arc bridge between letters)
                    ctx.beginPath();
                    ctx.moveTo(svgToCanvasX(x1_calc), cy_bot);
                    ctx.bezierCurveTo(svgToCanvasX(x1_calc), cy_top, svgToCanvasX(x2_calc), cy_top, svgToCanvasX(x2_calc), cy_bot);
                    ctx.stroke();
                }
                ctx.restore();
            }
            
            // === Draw side connections (motif/loop to letters) on 3D canvas ===
            ctx.save();
            ctx.strokeStyle = mat.base;
            ctx.lineWidth = 2.5 * svgScale;
            ctx.lineCap = 'round';
            
            const canvasYCenter = svgToCanvasY(100);
            
            // Left side connection
            if (motif === 'none') {
                // No motif: connect left loop to first letter
                const firstLetterX_calc = 250 - textW / 2 + letterWidths[0];
                ctx.beginPath();
                ctx.moveTo(svgToCanvasX(leftLoopX) + 7 * svgScale, canvasYCenter);
                ctx.lineTo(svgToCanvasX(firstLetterX_calc), canvasYCenter);
                ctx.stroke();
            } else if (placement === 'both' || placement === 'left') {
                // Motif present on left: connect left motif to first letter
                const firstLetterX_calc = 250 - textW / 2 + letterWidths[0];
                ctx.beginPath();
                ctx.moveTo(svgToCanvasX(250 - textW / 2 - 30) + 14 * svgScale, canvasYCenter);
                ctx.lineTo(svgToCanvasX(firstLetterX_calc), canvasYCenter);
                ctx.stroke();
            }
            
            // Right side connection
            if (motif === 'none') {
                // No motif: connect right loop to last letter
                const lastLetterX_calc = 250 + textW / 2 - letterWidths[letterWidths.length-1];
                ctx.beginPath();
                ctx.moveTo(svgToCanvasX(lastLetterX_calc), canvasYCenter);
                ctx.lineTo(svgToCanvasX(rightLoopX) - 7 * svgScale, canvasYCenter);
                ctx.stroke();
            } else if (placement === 'both' || placement === 'right') {
                // Motif present on right: connect right motif to last letter
                const lastLetterX_calc = 250 + textW / 2 - letterWidths[letterWidths.length-1];
                ctx.beginPath();
                ctx.moveTo(svgToCanvasX(lastLetterX_calc), canvasYCenter);
                ctx.lineTo(svgToCanvasX(250 + textW / 2 + 30) - 14 * svgScale, canvasYCenter);
                ctx.stroke();
            }
            ctx.restore();
            
            // Draw motifs on 3D canvas (使用SVG→Canvas映射，偏移量统一为30与SVG一致)
            // SVG中motif位置: left = 250 - textW/2 - 30, right = 250 + textW/2 + 30
            const svgLeftMotifX = 250 - textW / 2 - 30;
            const svgRightMotifX = 250 + textW / 2 + 30;
            const canvasLeftMotifX = svgToCanvasX(svgLeftMotifX);
            const canvasLeftMotifY = svgToCanvasY(100);
            const canvasRightMotifX = svgToCanvasX(svgRightMotifX);
            const canvasRightMotifY = svgToCanvasY(100);
            
            drawMotif(ctx, motif, canvasLeftMotifX, canvasLeftMotifY, 1.3 * svgScale, mat.base);
            if (placement === 'both' || placement === 'right') {
                drawMotif(ctx, motif, canvasRightMotifX, canvasRightMotifY, -1.3 * svgScale, mat.base);
            }
            
            // Draw highlight/gloss effect (使用映射坐标)
            ctx.save();
            ctx.globalAlpha = 0.15;
            const gradX1 = svgToCanvasX(250 - textW/2);
            const gradX2 = svgToCanvasX(250 + textW/2);
            const gradY1 = svgToCanvasY(100 - size/2);
            const gradY2 = svgToCanvasY(100 + size/2);
            const gradient = ctx.createLinearGradient(gradX1, gradY1, gradX2, gradY2);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.5, 'transparent');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.font = `bold ${size * svgScale}px ${font}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, svgToCanvasX(250), svgToCanvasY(100) + 5 * svgScale, textW * svgScale + 20);
            ctx.restore();
            
            ctx.restore();
        }

        // === Mouse Interaction for 3D Rotation ===
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                rotY += dx * 0.5;
                rotX -= dy * 0.5;
                // Clamp X rotation
                rotX = Math.max(-89, Math.min(89, rotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                autoRotate = false;
            } else if (scene3d.contains(e.target) || canvas.contains(e.target)) {
                // Subtle tilt following mouse within the 3D area
                const rect = scene3d.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                rotY = x * 30;
                rotX = -y * 20;
                autoRotate = false;
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (scene3d.contains(e.target) || canvas.contains(e.target)) {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                canvas.style.cursor = 'grabbing';
                autoRotate = false;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
            // Resume auto-rotate after 3 seconds of inactivity
            setTimeout(() => { if (!isDragging) autoRotate = true; }, 3000);
        });

        // Zoom with mouse wheel
        scene3d.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            zoom = Math.max(0.5, Math.min(2.5, zoom + delta));
        }, { passive: false });

        // Touch support for mobile
        let touchStartX = 0, touchStartY = 0, touchDist = 0;
        scene3d.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                autoRotate = false;
            } else if (e.touches.length === 2) {
                touchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        scene3d.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - lastMouseX;
                const dy = e.touches[0].clientY - lastMouseY;
                rotY += dx * 0.5;
                rotX -= dy * 0.5;
                rotX = Math.max(-89, Math.min(89, rotX));
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const newDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const delta = newDist - touchDist;
                zoom = Math.max(0.5, Math.min(2.5, zoom + delta * 0.005));
                touchDist = newDist;
            }
        }, { passive: false });

        scene3d.addEventListener('touchend', () => {
            isDragging = false;
            setTimeout(() => { if (!isDragging) autoRotate = true; }, 3000);
        });

        // === Animation Loop ===
        function animate() {
            if (autoRotate && !isDragging) {
                rotY += autoRotateSpeed;
            }
            renderAll();
            requestAnimationFrame(animate);
        }

        // === Event Listeners ===
        nameInput.addEventListener('input', () => { autoRotate = false; renderAll(); });
        fontSelect.addEventListener('change', () => { autoRotate = false; renderAll(); });
        motifSelect.addEventListener('change', () => { autoRotate = false; renderAll(); });
        placementSelect.addEventListener('change', () => { autoRotate = false; renderAll(); });
        materialSelect.addEventListener('change', () => { autoRotate = false; renderAll(); });
        sizeSlider.addEventListener('input', () => { autoRotate = false; renderAll(); });
        thickSlider.addEventListener('input', () => { autoRotate = false; renderAll(); });
        baseBridgeCheck.addEventListener('change', () => { autoRotate = false; renderAll(); });

        // Download SVG
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const svgData = new XMLSerializer().serializeToString(svgPreview);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl = URL.createObjectURL(svgBlob);
            const downloadLink = document.createElement('a');
            downloadLink.href = svgUrl;
            downloadLink.download = `${nameInput.value || 'Lesley'}_3D_Necklace.svg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });

        // === Start ===
        setTimeout(() => {
            animate();
        }, 300);
    </script>
</body>
</html>
